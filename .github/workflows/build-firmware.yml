name: Build ESP32-C3 firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - "partitions_ota_4mb.csv"
      - "dependencies.lock"
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build firmware packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ESP32-C3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c3
          command: >-
            idf.py build &&
            mkdir -p artifacts &&
            cp build/ws2812_status.bin artifacts/ws2812-status-ota.bin &&
            cd build &&
            esptool.py --chip esp32c3 merge_bin
            -o ../artifacts/ws2812-status-direct-flash.bin @flash_args

      - name: Upload OTA firmware
        uses: actions/upload-artifact@v4
        with:
          name: ws2812-status-ota
          if-no-files-found: error
          path: artifacts/ws2812-status-ota.bin

      - name: Upload serial flash firmware
        uses: actions/upload-artifact@v4
        with:
          name: ws2812-status-direct-flash
          if-no-files-found: error
          path: artifacts/ws2812-status-direct-flash.bin
