name: Build Windows Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build the bundled Python bridge
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pyinstaller
          pyinstaller --clean --noconfirm --onefile `
            --name bridge-x86_64 `
            --paths desktop `
            --collect-all psutil `
            --collect-submodules codex_status_core `
            desktop/tauri_bridge.py
          New-Item -ItemType Directory -Force desktop/tauri_app/src-tauri/binaries | Out-Null
          Copy-Item dist/bridge-x86_64.exe desktop/tauri_app/src-tauri/binaries/bridge-x86_64.exe

      - name: Verify and test
        shell: pwsh
        run: |
          Test-Path desktop/tauri_app/src-tauri/binaries/bridge-x86_64.exe
          Set-Location desktop
          python -m unittest discover -s tests -v
          Set-Location tauri_app
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile

      - name: Build Windows setup installer
        working-directory: desktop/tauri_app
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Prepare flat Windows packages
        shell: pwsh
        run: |
          $release = "desktop/tauri_app/src-tauri/target/x86_64-pc-windows-msvc/release"
          $packages = "artifacts/windows"
          $portable = "artifacts/windows/Beacon-Windows-x64-Portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item "$release/codex-status-bridge.exe" "$portable/Beacon.exe"
          Copy-Item "$release/binaries/bridge-x86_64.exe" "$portable/bridge-x86_64.exe"
          @'
          Beacon portable edition

          This package is self-contained. Keep Beacon.exe and
          bridge-x86_64.exe in the same directory.

          Requirements:
          - Windows 10/11 with Microsoft Edge WebView2 Runtime

          To install Beacon system-wide, use Beacon-Windows-x64-Setup.exe.
          '@ | Set-Content -Encoding utf8 "$portable/README.txt"
          Compress-Archive -Path "$portable/*" -DestinationPath "$packages/Beacon-Windows-x64-Portable.zip" -Force

          $installer = Get-ChildItem "$release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS setup installer was not generated" }
          Copy-Item $installer.FullName "$packages/Beacon-Windows-x64-Setup.exe"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Beacon-Windows-x64-Portable
          path: artifacts/windows/Beacon-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload setup installer
        uses: actions/upload-artifact@v4
        with:
          name: Beacon-Windows-x64-Setup
          path: artifacts/windows/Beacon-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
