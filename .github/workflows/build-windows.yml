name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build the bundled Python bridge
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pyinstaller
          pyinstaller --clean --noconfirm --onefile `
            --name bridge-x86_64 `
            --paths desktop `
            --collect-all psutil `
            --collect-submodules codex_status_core `
            desktop/tauri_bridge.py
          New-Item -ItemType Directory -Force desktop/tauri_app/src-tauri/binaries | Out-Null
          Copy-Item dist/bridge-x86_64.exe desktop/tauri_app/src-tauri/binaries/bridge-x86_64.exe

      - name: Verify and test
        shell: pwsh
        run: |
          Test-Path desktop/tauri_app/src-tauri/binaries/bridge-x86_64.exe
          Set-Location desktop
          python -m unittest discover -s tests -v
          Set-Location tauri_app
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile

      - name: Build Windows installers
        working-directory: desktop/tauri_app
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: Beacon-Windows-x64-Installers
          path: |
            desktop/tauri_app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/tauri_app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
