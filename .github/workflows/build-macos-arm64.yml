name: Build macOS Universal DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build self-contained backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pyinstaller
          pyinstaller --clean --noconfirm --onefile \
            --name bridge-${{ matrix.arch }} \
            --paths desktop --collect-all bleak --collect-all psutil \
            --collect-submodules codex_status_core \
            --hidden-import windows_app.ble_worker \
            desktop/tauri_bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.arch }}
          path: dist/bridge-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  build:
    needs: backend
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Download embedded backends
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: desktop/tauri_app/src-tauri/binaries
          merge-multiple: true
      - name: Install and verify
        run: |
          chmod +x desktop/tauri_app/src-tauri/binaries/bridge-*
          test -x desktop/tauri_app/src-tauri/binaries/bridge-aarch64
          test -x desktop/tauri_app/src-tauri/binaries/bridge-x86_64
          python -m pip install -r desktop/requirements.txt
          cd desktop
          python -m unittest discover -s tests -v
          cd tauri_app
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
      - name: Build Universal DMG
        working-directory: desktop/tauri_app
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CodexStatusBridge-macOS-Universal-DMG
          path: desktop/tauri_app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
