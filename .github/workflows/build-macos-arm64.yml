name: Build macOS Universal DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          cd desktop/tauri_app
          pnpm install --frozen-lockfile

      - name: Run shared tests
        working-directory: desktop
        run: python -m unittest discover -s tests -v

      - name: Build Universal DMG
        working-directory: desktop/tauri_app
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Upload temporary DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexStatusBridge-macOS-Universal-DMG
          path: desktop/tauri_app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
