name: Build macOS Architecture DMGs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-macos-arm64.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            native-arch: arm64
            rust-target: aarch64-apple-darwin
            artifact: Beacon-macOS-Apple-Silicon-DMG
          - runner: macos-15-intel
            arch: x86_64
            native-arch: x86_64
            rust-target: x86_64-apple-darwin
            artifact: Beacon-macOS-Intel-DMG
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Build architecture-specific native components
        run: |
          test "$(uname -m)" = "${{ matrix.native-arch }}"
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pyinstaller
          pyinstaller --clean --noconfirm --onefile \
            --name bridge-${{ matrix.arch }} \
            --paths desktop --collect-all psutil \
            --collect-submodules codex_status_core \
            desktop/tauri_bridge.py
          mkdir -p desktop/tauri_app/src-tauri/binaries
          cp dist/bridge-${{ matrix.arch }} desktop/tauri_app/src-tauri/binaries/
          lipo -archs desktop/tauri_app/src-tauri/binaries/bridge-${{ matrix.arch }} \
            | grep -q "${{ matrix.native-arch }}"
          xcrun swiftc -emit-library \
            desktop/tauri_app/src-tauri/native/macos_corebluetooth.swift \
            -o desktop/tauri_app/src-tauri/binaries/libbeacon_macos_ble.dylib \
            -framework Foundation -framework CoreBluetooth
          lipo -archs desktop/tauri_app/src-tauri/binaries/libbeacon_macos_ble.dylib \
            | grep -q "${{ matrix.native-arch }}"
      - name: Install and verify
        run: |
          chmod +x desktop/tauri_app/src-tauri/binaries/bridge-*
          test -x desktop/tauri_app/src-tauri/binaries/bridge-${{ matrix.arch }}
          test -f desktop/tauri_app/src-tauri/binaries/libbeacon_macos_ble.dylib
          if cargo tree --manifest-path desktop/tauri_app/src-tauri/Cargo.toml \
            --target "${{ matrix.rust-target }}" -e normal | grep -q btleplug; then
            echo "macOS target must not contain the btleplug backend"
            exit 1
          fi
          python -m pip install -r desktop/requirements.txt
          cd desktop
          python -m unittest discover -s tests -v
          cd tauri_app
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
      - name: Build architecture-specific DMG
        working-directory: desktop/tauri_app
        run: pnpm tauri build --target ${{ matrix.rust-target }} --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/tauri_app/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
