[package]
name = "codex-status-bridge"
version = "1.0.1"
description = "Beacon desktop status light"
authors = ["Beacon"]
edition = "2021"

[lib]
name = "codex_status_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
base64 = "0.22"

[target.'cfg(not(target_os = "macos"))'.dependencies]
btleplug = "0.12"
uuid = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSImage", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSWindow"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
