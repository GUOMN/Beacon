[package]
name = "codex-status-bridge"
version = "0.1.0"
description = "Codex Status Bridge desktop shell"
authors = ["Codex Status Bridge"]
edition = "2021"

[lib]
name = "codex_status_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
