[package]
name = "codex-status-bridge"
version = "0.1.0"
description = "Beacon desktop status light"
authors = ["Beacon"]
edition = "2021"

[lib]
name = "codex_status_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
btleplug = "0.11"
tokio = { version = "1", features = ["sync", "time"] }
base64 = "0.22"
uuid = "1"
futures = "0.3"
